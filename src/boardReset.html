<div class="board-reset">
  <h2>Reset board</h2>
  <div class="board-reset-actions" role="group" aria-label="Reset board appearance">
    <button type="button" data-board-reset="colors" title="Reset all panel colors to the current theme" aria-label="Reset board colors to theme"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18h1a2 2 0 0 0 1.5-3.3 1.5 1.5 0 0 1 1.1-2.5H18a3 3 0 0 0 3-3A9 9 0 0 0 12 3Z"/><circle cx="7" cy="10" r="1"/><circle cx="11" cy="7" r="1"/><circle cx="16" cy="9" r="1"/></svg><span>Colors</span></button>
    <button type="button" data-board-reset="cells" title="Reset panel spans, mobile height, and panels per tab" aria-label="Reset board cell sizes"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18M12 3v18"/></svg><span>Cells</span></button>
    <button type="button" data-board-reset="text" title="Reset all panel text sizes" aria-label="Reset board text sizes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V4h16v3M12 4v16M8 20h8"/></svg><span>Text</span></button>
    <button type="button" data-board-reset="all" title="Reset colors, cell sizes, and text sizes; keep the theme and session positions" aria-label="Reset all board appearance"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg><span>All</span></button>
  </div>
</div>
