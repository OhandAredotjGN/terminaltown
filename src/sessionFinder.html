<dialog id="sessionFinder" class="session-finder" aria-labelledby="sessionFinderTitle">
  <header><h2 id="sessionFinderTitle">Find session</h2><button type="button" id="sessionFinderClose" aria-label="Close session search">×</button></header>
  <input id="sessionFinderInput" type="search" autocomplete="off" placeholder="Name or purpose…" aria-label="Session name or purpose" aria-controls="sessionFinderResults">
  <p id="sessionFinderStatus" role="status">Loading sessions…</p>
  <div id="sessionFinderResults"></div>
</dialog>
